name: Build and Release yt-mini APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.10.2 || true
          fi
          chmod +x gradlew || true

      - name: Determine New Semantic Version
        id: versioning
        run: |
          # The version comes from versionName in app/build.gradle.kts. The first build of a new
          # version is its stable release (vX.Y.Z); later pushes on the same version are
          # prereleases (vX.Y.Z-build.N) until versionName is bumped again.
          BUILD_NUMBER=$(git rev-list --count HEAD)
          BASE_VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi
          git fetch --tags --force --quiet
          if [ "$BASE_VERSION" = "1.0.0" ]; then
            # 1.x test builds keep the old numbering: 1.0.<commit count>, each its own release.
            VERSION_NAME="1.0.${BUILD_NUMBER}"
            PRERELEASE=false
          elif git rev-parse -q --verify "refs/tags/v${BASE_VERSION}" >/dev/null; then
            VERSION_NAME="${BASE_VERSION}-build.${BUILD_NUMBER}"
            PRERELEASE=true
          else
            VERSION_NAME="${BASE_VERSION}"
            PRERELEASE=false
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${BUILD_NUMBER}" >> $GITHUB_ENV
          echo "PRERELEASE=${PRERELEASE}" >> $GITHUB_ENV
          echo "Computed Version Name: ${VERSION_NAME} (prerelease: ${PRERELEASE})"
          echo "Computed Version Code: ${BUILD_NUMBER}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.version.code=${{ env.VERSION_CODE }} \
            -Pandroid.injected.version.name=${{ env.VERSION_NAME }} \
            --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching in build/outputs/apk..."
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "./yt-mini-v${{ env.VERSION_NAME }}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "yt-mini v${{ env.VERSION_NAME }}"
          body: |
            ## yt-mini v${{ env.VERSION_NAME }}

            ### New since 1.0
            - Account sync both ways: likes, Watch later, playlists and subscriptions follow your Google account, with a channel / Brand account switcher.
            - Faster playback with adaptive streaming, a play next queue, sleep timer, captions styling and auto-translate.
            - Watch page extras: end screens, info cards, Most replayed and Jump ahead, transcript, live chat and chat replay, precise seeking and screen lock.
            - Search filters, channel tabs (Videos, Shorts, Live, Releases, Playlists, Posts), Home topic chips and Explore.
            - YT Music artists, albums, library, timed lyrics and smart downloads.
            - Android Auto, home screen widgets, app shortcuts, voice search and tablet side navigation.
            - Link with TV code, Your clips, Your movies and Time watched.
            - Shorts: recommended Shorts, the next ones start instantly (their first seconds download ahead), and your place is kept until the app is closed.
            - Videos resume where you left off, with a red progress bar on thumbnails, and chapters show on the seek bar.
            - Tap the Premium logo at the top to switch to YT Music (and the Music logo to switch back).

            ### What's inside
            - **YouTube and YouTube Music in one app**: tap the logo at the top to switch.
            - Home, search, channels, playlists, Shorts, subscriptions, live streams and comments.
            - Playlists, Watch later, liked videos, history, offline downloads and a local backup.
            - Notifications for new uploads, reminders, picture-in-picture and Google Cast.
            - Light and dark themes, tablet layouts, and a Settings screen.
            - Signed with a fixed key, so each build installs over the previous one.

            ### Not in this release
            - Super Thanks, Remix, Hum to search, the Samples tab, Clip and Report.
            - Video upload is hidden for now.

            Built automatically by CI/CD on commit `${{ github.sha }}`.
          files: |
            yt-mini-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
